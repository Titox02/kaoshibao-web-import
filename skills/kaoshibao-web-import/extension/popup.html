<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>网页逐题采集</title><style>body{width:390px;margin:0;padding:16px;font:14px/1.6 system-ui;color:#222}h1{font-size:18px;margin:0 0 12px}label{display:block;margin:10px 0 4px}input,textarea,button{font:inherit;box-sizing:border-box}input,textarea{width:100%;padding:7px;border:1px solid #bbb;border-radius:4px}textarea{height:190px;font:12px/1.5 monospace}button{padding:8px 10px;min-height:40px;border:1px solid #bbb;background:#fff;border-radius:4px;cursor:pointer}.buttons{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.primary{background:#304f78;color:#fff;border-color:#304f78}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f5f5f5;padding:10px;font:12px/1.6 system-ui}.muted{color:#666;font-size:12px}#empty{width:auto}details{margin-top:12px}</style></head><body><h1>网页逐题采集</h1><p class="muted">先在考试宝打开已授权题库的背题模式。只保存可见 DOM，不主动请求题库接口。采集时请勿切题或换标签。</p><label for="name">本次题库名称（区分中英文）</label><input id="name" placeholder="例如：CAPM 英文"><label for="config">选择器配置（先核对当前页面）</label><textarea id="config" spellcheck="false"></textarea><label for="batch">本批最多保存题数（1–100）</label><input id="batch" type="number" min="1" max="100" value="25"><div class="buttons"><button id="preview">预览本题</button><button id="new">从第 1 题新建</button><button id="rebind">验证并恢复此标签</button><button id="run" class="primary">开始 / 继续</button><button id="stop">停止</button><button id="status">刷新统计</button><button id="export">导出存档</button></div><details><summary>本题原解析确实为空</summary><p class="muted">只有已人工确认不是加载中，才使用此项。仅作用于当前题号，不会对后续题自动放行。</p><button id="empty-save">确认本题无原解析，仅保存本题</button></details><pre id="result" role="status">正在读取本地存档…</pre><script src="core.js"></script><script src="popup.js"></script></body></html>
